<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <link rel="icon" href="/icon.png">
    <title>Refined GitHub HTML Preview</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: sans-serif;
        margin: 0;
      }

      main {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        height: 100vh;
        padding: 0.5rem;
      }

      header {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 2rem;

        div:first-child {
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 1rem;
        }

        img {
          width: 4rem;
          height: 4rem;
        }

        @media (width < 768px) {
          flex-direction: column;
          gap: 0;

          img {
            width: 2rem;
            height: 2rem;
          }

          h1 {
            margin: 0;
          }

          p {
            margin: 0.5rem 0;
          }
        }
      }

      iframe {
        flex-grow: 1;
        border: 1px solid gray;
        border-radius: 0.5rem;
      }
    </style>
  </head>

  <body>
    <main>
      <header>
        <div>
          <img src="/icon.png" alt="Refined GitHub icon">
          <h1>Refined GitHub HTML Preview</h1>
        </div>

        <div>
          <p>
            <strong>
              ⚠️ Do not enter passwords or personal information on this page. ⚠️
            </strong>
          </p>
          <p>
            This is a page previewed by a user of
            <a
              href="https://github.com/refined-github/refined-github"
            >Refined GitHub</a>.
          </p>
        </div>
      </header>

      <iframe
        src="{{target}}"
        sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads allow-orientation-lock allow-pointer-lock allow-presentation"
        referrerpolicy="strict-origin"
      ></iframe>
    </main>
  </body>
</html>
